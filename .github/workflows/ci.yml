# Product CI. Both GitHub Actions and GitLab CI call scripts/pipeline.sh.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend tools
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Ruff + pytest
        run: make backend
        env:
          PYTHON: python
          RUFF: ruff

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: ESLint, Vitest, production build
        run: make frontend
        env:
          CI: "true"

  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend tools
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Comments and dead-code
        run: make quality
        env:
          PYTHON: python
          RUFF: ruff

  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [backend, frontend, quality]
    steps:
      - name: All product gates passed
        run: echo "backend, frontend, and quality are green"
